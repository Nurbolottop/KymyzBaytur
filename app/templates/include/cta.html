{% load static assets %}
<section class="cta">
  <div class="cta__bg"><img src="{% static 'img/yurt-window.webp' %}" srcset="{% static_srcset 'img/yurt-window.webp' %}" sizes="100vw" alt="" loading="lazy"></div>
  <div class="container cta__inner reveal">
    <span class="eyebrow eyebrow--light">Сезон кымыза ждёт</span>
    <h2 class="cta__title">Забронируйте отдых в Суусамыре</h2>
    <p class="cta__text">Оставьте заявку — мы подтвердим даты, подберём номер или юрту и при необходимости организуем трансфер.</p>
    <div class="cta__actions">
      <a class="btn btn--primary btn--lg" href="{% url 'booking' %}">Оставить заявку</a>
      <a class="btn btn--light btn--lg" href="{{ site.whatsapp_href }}" target="_blank" rel="noopener"><svg class="icon"><use href="#i-whatsapp"/></svg>WhatsApp</a>
    </div>
  </div>
</section>
