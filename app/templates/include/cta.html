{% load static assets %}
<section class="cta">
  <div class="cta__bg" data-parallax="0.18"><img src="{% static 'img/yurt-window.webp' %}" srcset="{% static_srcset 'img/yurt-window.webp' %}" sizes="100vw" alt="Вид на горы Суусамыра из окна — отдых в кымызолечебнице «Байтур»" loading="lazy"></div>
  <div class="container">
    <div class="cta__card glass glass--dark reveal spot" data-tilt>
      <span class="eyebrow eyebrow--light">Сезон кымыза ждёт</span>
      <h2 class="cta__title" data-split>Забронируйте отдых <em>в Суусамыре</em></h2>
      <p class="cta__text">Оставьте заявку — мы подтвердим даты, подберём номер или юрту и при необходимости организуем трансфер.</p>
      <div class="cta__actions">
        <a class="btn btn--primary btn--lg" href="{% url 'booking' %}" data-magnetic><span>Оставить заявку</span></a>
        <a class="btn btn--glass btn--lg" href="{{ site.whatsapp_href }}" target="_blank" rel="noopener"><svg class="icon"><use href="#i-whatsapp"/></svg><span>WhatsApp</span></a>
      </div>
    </div>
  </div>
</section>
