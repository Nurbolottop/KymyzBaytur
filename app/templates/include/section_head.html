<div class="section-head{% if center %} section-head--center{% endif %} reveal">
  {% if eyebrow %}<span class="eyebrow{% if light %} eyebrow--light{% endif %}"><svg class="icon"><use href="#i-ornament"/></svg>{{ eyebrow }}</span>{% endif %}
  <h2 class="section-title{% if light %} section-title--light{% endif %}">{{ title }}</h2>
  {% if text %}<p class="section-text{% if light %} section-text--light{% endif %}">{{ text }}</p>{% endif %}
</div>
