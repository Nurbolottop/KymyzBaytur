{% load assets %}
<section class="page-hero">
  <div class="page-hero__bg"><img src="{{ image }}" srcset="{{ image|srcset }}" sizes="100vw" alt="" fetchpriority="high"></div>
  <div class="container page-hero__inner">
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a href="{% url 'home' %}">Главная</a>
      {% if parent_url %}<span class="breadcrumbs__sep">/</span><a href="{{ parent_url }}">{{ parent_title }}</a>{% endif %}
      <span class="breadcrumbs__sep">/</span><span aria-current="page">{{ title }}</span>
    </nav>
    <h1 class="page-hero__title">{{ title }}</h1>
    {% if subtitle %}<p class="page-hero__subtitle">{{ subtitle }}</p>{% endif %}
  </div>
</section>
