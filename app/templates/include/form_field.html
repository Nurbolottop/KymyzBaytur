<div class="field{% if field.errors %} has-error{% endif %}{% if wide %} field--wide{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ field }}
  {% for error in field.errors %}<span class="field__error">{{ error }}</span>{% endfor %}
</div>
