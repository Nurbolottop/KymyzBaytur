{% load static %}
{% with url=request.resolver_match.url_name %}
<header class="header" data-header>
  <div class="container">
    <div class="header__bar">
      <a class="brand" href="{% url 'home' %}">
        <img class="brand__logo" src="{% static 'img/logo.png' %}" alt="" width="46" height="45">
        <span class="brand__text">
          <span class="brand__name">Байтур</span>
          <span class="brand__sub">кымызолечебница</span>
        </span>
      </a>

      <nav class="nav" data-nav aria-label="Основное меню">
        <a class="nav__link{% if url == 'about' %} is-active{% endif %}" href="{% url 'about' %}"><span>О нас</span></a>
        <a class="nav__link{% if url == 'kymyz' %} is-active{% endif %}" href="{% url 'kymyz' %}"><span>Кымызолечение</span></a>
        <a class="nav__link{% if url == 'rooms' or url == 'room_detail' %} is-active{% endif %}" href="{% url 'rooms' %}"><span>Номера</span></a>
        <a class="nav__link{% if url == 'services' %} is-active{% endif %}" href="{% url 'services' %}"><span>Услуги</span></a>
        <a class="nav__link{% if url == 'prices' %} is-active{% endif %}" href="{% url 'prices' %}"><span>Цены</span></a>
        <a class="nav__link{% if url == 'gallery' %} is-active{% endif %}" href="{% url 'gallery' %}"><span>Галерея</span></a>
        <a class="nav__link{% if url == 'reviews' %} is-active{% endif %}" href="{% url 'reviews' %}"><span>Отзывы</span></a>
        <a class="nav__link{% if url == 'contacts' %} is-active{% endif %}" href="{% url 'contacts' %}"><span>Контакты</span></a>
        <div class="nav__mobile-extra">
          <a class="btn btn--primary btn--block btn--lg" href="{% url 'booking' %}"><span>Забронировать</span></a>
          <a class="nav__phone" href="{{ site.phone_href }}"><svg class="icon"><use href="#i-phone"/></svg>{{ site.phone }}</a>
          <span class="nav__season">{{ site.season }}</span>
        </div>
      </nav>

      <div class="header__actions">
        <a class="icon-btn header__phone" href="{{ site.phone_href }}" aria-label="Позвонить {{ site.phone }}"><svg class="icon"><use href="#i-phone"/></svg></a>
        <a class="btn btn--primary btn--sm header__cta" href="{% url 'booking' %}" data-magnetic><span>Забронировать</span></a>
        <button class="burger" type="button" data-burger aria-label="Меню" aria-expanded="false">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </div>
</header>
{% endwith %}
